<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efe4cd"><meta name="description" content="一段从杂役院开始的逆袭。探索院落、结识伙伴，在亲手赢下的考核中拿回资格。"><title>杂役院 · 第一回</title><link rel="stylesheet" href="courtyard.css?v=1"></head>
<body data-mode="title"><canvas id="world" tabindex="0" aria-label="杂役院，使用 WASD 移动，E 与附近的人物或物品互动"></canvas>
<div id="loading">正在翻开这一回……</div>
<header id="hud"><div class="status paper"><img src="assets/hero-rig/standing.webp" alt="银发主角"><div><span class="small">你的身份</span><b id="identity">杂役弟子</b><div class="health-track"><i id="health"></i></div><small id="condition">身体无恙</small></div></div><div class="chapter-tag"><span>第一回</span><b>杂役院</b></div><nav><button id="journalBtn" aria-label="打开手记">手记 <kbd>Tab</kbd></button><button id="pauseBtn" aria-label="暂停">歇会儿 <kbd>Esc</kbd></button></nav></header>
<div id="enemyHud" class="paper"><small id="enemyIntent"></small><strong id="enemyName"></strong><div class="enemy-track"><i id="enemyHealth"></i></div></div>
<button id="objective" class="paper"><span id="chapterStep">院中差事</span><b id="questTitle"></b><small id="questDetail"></small></button>
<div id="toast" role="status" aria-live="polite"></div><div id="counterNotice">破绽已露 · 可以借势</div>
<div id="controls"><span id="moveHint">WASD 移动 · 靠近后 E 互动</span><button id="interactBtn" class="action interact" aria-label="与附近目标互动"><b>谈</b><span id="interactLabel">互动</span><kbd>E</kbd></button><div id="fightControls"><button id="attackBtn" class="action"><b>击</b><span>连击</span><kbd>J</kbd></button><button id="skillBtn" class="action"><b>势</b><span>未习得</span><kbd>K</kbd></button><button id="dodgeBtn" class="action"><b>避</b><span>闪身</span><kbd>空格</kbd></button></div></div>
<div id="overlay"></div><div id="dialogue" class="paper" role="dialog" aria-modal="true" aria-label="剧情对话"><div class="portrait-wrap"><img id="portrait" alt="对话人物"></div><div class="dialogue-content"><div class="speakerline"><span id="speaker"></span><small id="sceneLabel"></small></div><p id="dialogueText"></p><div id="choices"></div></div></div>
<script src="courtyard.js?v=2"></script><script src="hero-rig-data.js?v=rig1"></script><script src="hero-rig.js?v=courtyard1"></script><script>boot();</script></body></html>
